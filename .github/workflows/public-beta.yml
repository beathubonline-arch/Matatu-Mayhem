name: Matatu Mayhem Web Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r /root/.local/share/godot/export_templates/4.7.2.stable/* ~/.local/share/godot/export_templates/4.7.2.stable/ || true
      - name: Export Web beta
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Install native Web radio
        run: |
          mkdir -p build/web/radio
          cp audio/radio/*.ogg build/web/radio/
          cp web/radio.js build/web/radio.js
          sed -i 's#</body>#<script src="radio.js"></script></body>#' build/web/index.html
          test "$(find build/web/radio -maxdepth 1 -name '*.ogg' | wc -l)" -eq 4
          grep -q 'radio.js' build/web/index.html
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Public Beta
        id: deployment
        uses: actions/deploy-pages@v4
