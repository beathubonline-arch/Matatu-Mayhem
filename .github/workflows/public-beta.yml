name: Matatu Mayhem Web Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r /root/.local/share/godot/export_templates/4.7.2.stable/* ~/.local/share/godot/export_templates/4.7.2.stable/ || true
      - name: Export Web beta
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Export Android debug APK
        run: |
          mkdir -p build/android build/web/downloads
          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_SDK="$(dirname "$(dirname "$JAVA_BIN")")"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\n' "$JAVA_SDK" > ~/.config/godot/editor_settings-4.7.tres
          test -x "$JAVA_SDK/bin/jarsigner"
          godot --headless --path . --export-debug "Android" build/android/MatatuMayhem-v0.13.apk
          cp build/android/MatatuMayhem-v0.13.apk build/web/downloads/MatatuMayhem-Android.apk
          test -s build/web/downloads/MatatuMayhem-Android.apk
      - name: Install native Web radio
        run: |
          mkdir -p build/web/radio
          cp audio/radio/*.ogg build/web/radio/
          cp web/radio.js build/web/radio.js
          sed -i 's#</body>#<script src="radio.js"></script></body>#' build/web/index.html
          test "$(find build/web/radio -maxdepth 1 -name '*.ogg' | wc -l)" -eq 4
          grep -q 'radio.js' build/web/index.html
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatatuMayhem-Android-v0.13
          path: build/android/MatatuMayhem-v0.13.apk
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Public Beta
        id: deployment
        uses: actions/deploy-pages@v4
